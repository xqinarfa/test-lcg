<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 44" fill="none">
  <!-- Neon Icon Heart / Gamepad -->
  <g transform="translate(0, 2)">
    <defs>
      <linearGradient id="logo-heart-grad" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#38bdf8" />
        <stop offset="50%" stop-color="#ec4899" />
        <stop offset="100%" stop-color="#f43f5e" />
      </linearGradient>
      <filter id="neon-glow" x="-20%" y="-20%" width="140%" height="140%">
        <feGaussianBlur stdDeviation="2" result="blur" />
        <feComposite in="SourceGraphic" in2="blur" operator="over" />
      </filter>
    </defs>
    <!-- Heart Icon Stack -->
    <rect x="2" y="2" width="36" height="36" rx="10" fill="#24141d" stroke="#f43f5e" stroke-width="1.5" stroke-opacity="0.8"/>
    <path d="M20 12 C18 9, 11 9.5, 11 16 C11 21, 20 27, 20 27 C20 27, 29 21, 29 16 C29 9.5, 22 9, 20 12 Z" 
          fill="url(#logo-heart-grad)" filter="url(#neon-glow)"/>
    <circle cx="16" cy="15" r="1.5" fill="#ffffff" opacity="0.9" />
    <circle cx="24" cy="15" r="1.5" fill="#ffffff" opacity="0.9" />
    <path d="M17 19 Q20 22 23 19" stroke="#ffffff" stroke-width="1.2" stroke-linecap="round" fill="none" opacity="0.9"/>
  </g>

  <!-- Typography -->
  <text x="48" y="26" fill="#FFFFFF" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-weight="800" font-size="20" letter-spacing="-0.02em">
    Love Couple Games
  </text>
</svg>
